name: Build Lambda Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and Lambda dependencies
        run: |
          mkdir -p package
          cp -r backend/app package/app
          python -m pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            --target package \
            -r backend/requirements.txt

      - name: Verify dependency metadata
        working-directory: package
        run: |
          
          python - <<'PY'
          import ast
          from pathlib import Path

          main_file = Path("app/main.py")
          assert main_file.is_file(), "app/main.py is missing"
          ast.parse(main_file.read_text())
          print("app/main.py syntax: OK")

          for name in ("fastapi", "pydantic", "pydantic_core", "mangum"):
              pattern = name.replace("_", "-") + "-*.dist-info"
              matches = list(Path(".").glob(pattern))
              assert matches, f"Missing package metadata for {name}"
              print(f"{name}: package metadata found")
          PY

      - name: Create deployment ZIP
        run: |
          cd package
          zip -r ../lambda.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-backend-lambda
          path: lambda.zip
          retention-days: 3
