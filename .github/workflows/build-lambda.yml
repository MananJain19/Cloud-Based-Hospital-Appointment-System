name: Build Lambda Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and Lambda dependencies
        run: |
          mkdir -p package
          cp -r backend/app package/app
          python -m pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            --target package \
            -r backend/requirements.txt

      - name: Verify dependencies and Lambda handler
        working-directory: package
        run: |
          python -c "import pydantic, pydantic_core, fastapi; print('Pydantic:', pydantic.__version__); print('Pydantic Core:', pydantic_core.__version__); print('FastAPI:', fastapi.__version__)"
          python -c "from app.main import app; print('FastAPI application import: OK')"
          python -c "from mangum import Mangum; from app.main import app; handler = Mangum(app); print('Mangum handler creation: OK')"

      - name: Create deployment ZIP
        run: |
          cd package
          zip -r ../lambda.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-backend-lambda
          path: lambda.zip
          retention-days: 3
